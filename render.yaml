services:
  - type: web
    runtime: static
    name: api-tj-admin
    plan: free
    rootDir: admin-app
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://apitj-production.up.railway.app/api/v1
      - key: VITE_APP_NAME
        value: API_TJ Admin
      - key: VITE_SESSION_STORAGE_KEY
        value: api_tj_admin_session
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
